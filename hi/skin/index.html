<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Skin Gallery 3D</title>
    <!-- Nhúng font chữ viết tay Meow Script cho Logo -->
    <link rel="preconnect" href="https://googleapis.com">
    <link rel="preconnect" href="https://gstatic.com" crossorigin>
    <link href="https://googleapis.com/css2?family=Meow+Script&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="style.css">
    <script src="skinview3d.bundle.js"></script>
</head>
<body>

    <!-- Phần Header Banner Cinnamoroll -->
    <header>
        <div class="logo">My Skins</div>
        <nav>
             <a class="primary" onclick="window.location.href='../nghich.html'">Quay lại trang chủ</a>
        </nav>
    </header>

    <!-- Nội dung chính bên dưới Header -->
    <main class="main-content">
        <h1>Bộ Sưu Tập Skin Của Tôi</h1>

        <div class="gallery-grid" id="gallery"></div>
    </main>

    <!-- Thanh Taskbar upload ở dưới cùng -->
    <div class="bottom-taskbar">
        <input type="text" id="skinNameInput" placeholder="Nhập tên skin...">
        <label class="file-upload-label">
            <span id="fileLabelText">📁 Chọn file Skin (.png)</span>
            <input type="file" id="skinFileInput" accept="image/png">
        </label>
        <button class="btn-upload" onclick="uploadSkin()">+ Đăng Skin</button>
         <footer>
             <p>© 2026 Bản quyền thuộc về NENE HELP. Thiết kế bởi NENE.</p>
         </footer>
    </div>


    <!-- Modal hiển thị model 3D giống NameMC -->
    <div class="modal-overlay" id="viewerModal" onclick="closeModalOnOutside(event)">
        <div class="modal-box">
            <div class="modal-header">
                <h3 id="modalTitle">Tên Skin</h3>
                <button class="close-modal" onclick="closeModal()">&times;</button>
            </div>

            <div class="canvas-wrapper">
                <canvas id="modal_canvas"></canvas>
                
                <div class="namemc-controls">
                    <button class="nmc-btn" id="btnPause" onclick="togglePause()" title="Phát / Tạm dừng">
                        <svg id="iconPause" viewBox="0 0 16 16"><path d="M5.5 3.5A1.5 1.5 0 0 1 7 5v6a1.5 1.5 0 0 1-3 0V5a1.5 1.5 0 0 1 1.5-1.5zm5 0A1.5 1.5 0 0 1 12 5v6a1.5 1.5 0 0 1-3 0V5a1.5 1.5 0 0 1 1.5-1.5z"/></svg>
                        <svg id="iconPlay" style="display:none;" viewBox="0 0 16 16"><path d="m11.596 8.697-6.363 3.692c-.54.313-1.233-.066-1.233-.697V4.308c0-.63.692-1.01 1.233-.696l6.363 3.692a.802.802 0 0 1 0 1.393z"/></svg>
                    </button>

                    <button class="nmc-btn" id="btnModel" onclick="toggleModelType()" title="Đổi dáng tay (Classic / Slim)">
                        <svg viewBox="0 0 16 16"><path d="M8 8a3 3 0 1 0 0-6 3 3 0 0 0 0 6zm2-3a2 2 0 1 1-4 0 2 2 0 0 1 4 0zm4 8c0 1-1 1-1 1H3s-1 0-1-1 1-4 6-4 6 3 6 4zm-1-.004c-.001-.246-.154-.986-.832-1.664C11.516 10.68 10.289 10 8 10c-2.29 0-3.516.68-4.168 1.332-.678.678-.83 1.418-.832 1.664h10z"/></svg>
                    </button>
                </div>
            </div>

            <div class="anim-bar">
                <button id="animWalk" class="active" onclick="setAnimation('walk')">Đi bộ</button>
                <button id="animIdle" onclick="setAnimation('idle')">Đứng</button>
                <button id="animRotate" onclick="toggleAutoRotate()">Tự xoay</button>
            </div>
        </div>
    </div>
    <div class="buttons" >
	<button onclick="window.location.href='../nghich.html'">Quay lại trang chủ</button>
</div>


    <script src="script.js"></script>
</body>
</html>
